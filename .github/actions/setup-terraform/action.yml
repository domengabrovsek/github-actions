name: Setup Terraform
description: Thin wrapper around hashicorp/setup-terraform, SHA-pinned centrally so every repo tracks the same version via @main.

inputs:
  terraform_version:
    description: Terraform version to install (e.g. 1.15.5). 'latest' installs the newest release.
    required: false
    default: 'latest'
  terraform_wrapper:
    description: Wrap the terraform binary to expose stdout/stderr/exitcode as step outputs. Set 'false' to call terraform directly.
    required: false
    default: 'true'
  cli_config_credentials_hostname:
    description: Hostname of the registry whose credentials are written to the CLI config.
    required: false
    default: ''
  cli_config_credentials_token:
    description: API token written to the CLI config for the registry hostname above.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ inputs.terraform_version }}
        terraform_wrapper: ${{ inputs.terraform_wrapper }}
        cli_config_credentials_hostname: ${{ inputs.cli_config_credentials_hostname }}
        cli_config_credentials_token: ${{ inputs.cli_config_credentials_token }}
