name: Checkout
description: Thin wrapper around actions/checkout, SHA-pinned centrally so every repo tracks the same version via @main.

inputs:
  repository:
    description: Repository name with owner. Defaults to the repository running the workflow.
    required: false
    default: ${{ github.repository }}
  ref:
    description: Branch, tag, or SHA to check out. Empty checks out the ref that triggered the workflow.
    required: false
    default: ''
  token:
    description: Token used to fetch the repository. Defaults to the workflow token.
    required: false
    default: ${{ github.token }}
  ssh-key:
    description: SSH key used to fetch the repository, as an alternative to token.
    required: false
    default: ''
  fetch-depth:
    description: Commits to fetch. 0 fetches full history (needed by scans and taggers that diff against the base).
    required: false
    default: '1'
  fetch-tags:
    description: Fetch tags even when fetch-depth > 0.
    required: false
    default: 'false'
  submodules:
    description: Check out submodules ('true', 'recursive', or 'false').
    required: false
    default: 'false'
  lfs:
    description: Download Git LFS files.
    required: false
    default: 'false'
  path:
    description: Directory under $GITHUB_WORKSPACE to check out into. Empty checks out at the workspace root.
    required: false
    default: ''
  clean:
    description: Run git clean and reset before fetching.
    required: false
    default: 'true'
  persist-credentials:
    description: Keep the auth token in the local git config for later steps.
    required: false
    default: 'true'
  sparse-checkout:
    description: Newline-separated patterns for a sparse checkout. Empty checks out the whole repo.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}
        token: ${{ inputs.token }}
        ssh-key: ${{ inputs.ssh-key }}
        fetch-depth: ${{ inputs.fetch-depth }}
        fetch-tags: ${{ inputs.fetch-tags }}
        submodules: ${{ inputs.submodules }}
        lfs: ${{ inputs.lfs }}
        path: ${{ inputs.path }}
        clean: ${{ inputs.clean }}
        persist-credentials: ${{ inputs.persist-credentials }}
        sparse-checkout: ${{ inputs.sparse-checkout }}
