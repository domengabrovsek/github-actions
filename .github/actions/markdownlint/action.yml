name: Markdownlint
description: Thin wrapper around DavidAnson/markdownlint-cli2-action, SHA-pinned centrally so every repo tracks the same version via @main.

inputs:
  globs:
    description: Glob expression(s) of files to lint, newline-delimited.
    required: false
    default: '*.{md,markdown}'
  config:
    description: Path of a base configuration file. Empty uses the repo's own .markdownlint* files.
    required: false
    default: ''
  fix:
    description: Fix supported issues in place ('true' or 'false').
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
      with:
        globs: ${{ inputs.globs }}
        config: ${{ inputs.config }}
        fix: ${{ inputs.fix }}
