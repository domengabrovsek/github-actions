name: Upload Artifact
description: Thin wrapper around actions/upload-artifact, SHA-pinned centrally so every repo tracks the same version via @main.

inputs:
  name:
    description: Artifact name.
    required: false
    default: 'artifact'
  path:
    description: A file, directory, or wildcard pattern that describes what to upload.
    required: true
  if-no-files-found:
    description: Behavior when no files match path ('warn', 'error', or 'ignore').
    required: false
    default: 'warn'
  retention-days:
    description: Days to keep the artifact. Empty uses the repository default.
    required: false
    default: ''
  compression-level:
    description: Zip compression level, 0 (none) to 9 (best).
    required: false
    default: '6'
  overwrite:
    description: Delete an existing artifact with the same name before uploading.
    required: false
    default: 'false'
  include-hidden-files:
    description: Include files that start with a dot.
    required: false
    default: 'false'

outputs:
  artifact-id:
    description: GitHub ID of the uploaded artifact, usable with the REST API.
    value: ${{ steps.upload.outputs.artifact-id }}
  artifact-url:
    description: URL to download the artifact from the run's UI.
    value: ${{ steps.upload.outputs.artifact-url }}
  artifact-digest:
    description: SHA-256 digest of the uploaded artifact.
    value: ${{ steps.upload.outputs.artifact-digest }}

runs:
  using: composite
  steps:
    - id: upload
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}
        overwrite: ${{ inputs.overwrite }}
        include-hidden-files: ${{ inputs.include-hidden-files }}
