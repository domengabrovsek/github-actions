# ==============================================
# Telegram Notify (central formatter)
# ==============================================
# The single source of truth for Telegram message layout. Callers supply
# structured data via typed inputs; this workflow owns all presentation -
# emoji, labels, field order, header, spacing, body truncation, and the
# derived Repository line. No other workflow builds a message body.
#
# Self-contained (formats AND sends) on purpose: GitHub caps nested reusable
# workflows at 4 levels, and the notification chain is already
# consumer -> notify.yml -> handler -> here. Delegating the send to a further
# reusable workflow would make it 5 levels and fail to run.

name: Telegram Notify

on:
  workflow_call:
    inputs:
      api_url:
        required: true
        type: string
        description: 'Telegram API webhook URL'
      chat_id:
        required: true
        type: string
        description: 'Telegram chat ID to send the message to'
      event_type:
        required: true
        type: string
        description: >
          Event kind that selects header, labels, field order, and which
          fields render. One of: pr_opened, pr_updated, pr_merged, pr_closed,
          pr_review_requested, pr_commented, pr_review_comment, pr_review,
          ci_status, deploy_started, deploy_success, deploy_failure,
          terraform_started, terraform_result, drift.
      status:
        required: false
        type: string
        description: >
          Sub-state for dynamic-header families: pr_review
          (approved/changes_requested/commented), ci_status
          (success/failure/cancelled/timed_out/skipped), terraform_result
          (success/failure), drift (clean/detected).
      title:
        required: false
        type: string
        description: 'PR / issue title, or CI run name for ci_status'
      actor:
        required: false
        type: string
        description: 'The person; label is chosen from event_type'
      reviewer:
        required: false
        type: string
        description: 'Requested reviewer (pr_review_requested only)'
      branch_head:
        required: false
        type: string
        description: 'Source branch, or the single branch for ci/deploy events'
      branch_base:
        required: false
        type: string
        description: 'Target branch (PR events)'
      file:
        required: false
        type: string
        description: 'File path (pr_review_comment)'
      body:
        required: false
        type: string
        description: 'Comment / review text; truncated to 300 chars here'
      commits:
        required: false
        type: string
        description: 'Preformatted multiline commit block'
      trigger:
        required: false
        type: string
        description: 'Raw workflow_run event name (ci_status); mapped to a label here'
      commit:
        required: false
        type: string
        description: 'Commit line for deploy / terraform events'
      stacks:
        required: false
        type: string
        description: 'Affected stacks (terraform_started)'
      link:
        required: false
        type: string
        description: 'Primary URL; label (Pull request / Workflow / Run) chosen from event_type'

jobs:
  # Thin wrapper around the notify composite action. The message builder lives in
  # .github/actions/notify so a caller that already has a job can send from a step
  # instead of paying for a second billed minute. Both paths render the same message.
  notify:
    name: Format and send
    runs-on: ubuntu-latest
    steps:
      - uses: domengabrovsek/github-actions/.github/actions/notify@main
        with:
          api_url: ${{ inputs.api_url }}
          chat_id: ${{ inputs.chat_id }}
          event_type: ${{ inputs.event_type }}
          status: ${{ inputs.status }}
          title: ${{ inputs.title }}
          actor: ${{ inputs.actor }}
          reviewer: ${{ inputs.reviewer }}
          branch_head: ${{ inputs.branch_head }}
          branch_base: ${{ inputs.branch_base }}
          file: ${{ inputs.file }}
          body: ${{ inputs.body }}
          commits: ${{ inputs.commits }}
          trigger: ${{ inputs.trigger }}
          commit: ${{ inputs.commit }}
          stacks: ${{ inputs.stacks }}
          link: ${{ inputs.link }}
