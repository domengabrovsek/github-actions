# ==============================================
# Telegram Notify (central formatter)
# ==============================================
# The single source of truth for Telegram message layout. Callers supply
# structured data via typed inputs; this workflow owns all presentation -
# emoji, labels, field order, header, spacing, body truncation, and the
# derived Repository line. No other workflow builds a message body.
#
# Self-contained (formats AND sends) on purpose: GitHub caps nested reusable
# workflows at 4 levels, and the notification chain is already
# consumer -> notify.yml -> handler -> here. Delegating the send to a further
# reusable workflow would make it 5 levels and fail to run.

name: Telegram Notify

on:
  workflow_call:
    inputs:
      api_url:
        required: true
        type: string
        description: 'Telegram API webhook URL'
      chat_id:
        required: true
        type: string
        description: 'Telegram chat ID to send the message to'
      event_type:
        required: true
        type: string
        description: >
          Event kind that selects header, labels, field order, and which
          fields render. One of: pr_opened, pr_updated, pr_merged, pr_closed,
          pr_review_requested, pr_commented, pr_review_comment, pr_review,
          ci_status, deploy_started, deploy_success, deploy_failure,
          terraform_started, terraform_result, drift.
      status:
        required: false
        type: string
        description: >
          Sub-state for dynamic-header families: pr_review
          (approved/changes_requested/commented), ci_status
          (success/failure/cancelled/timed_out/skipped), terraform_result
          (success/failure), drift (clean/detected).
      title:
        required: false
        type: string
        description: 'PR / issue title, or CI run name for ci_status'
      actor:
        required: false
        type: string
        description: 'The person; label is chosen from event_type'
      reviewer:
        required: false
        type: string
        description: 'Requested reviewer (pr_review_requested only)'
      branch_head:
        required: false
        type: string
        description: 'Source branch, or the single branch for ci/deploy events'
      branch_base:
        required: false
        type: string
        description: 'Target branch (PR events)'
      file:
        required: false
        type: string
        description: 'File path (pr_review_comment)'
      body:
        required: false
        type: string
        description: 'Comment / review text; truncated to 300 chars here'
      commits:
        required: false
        type: string
        description: 'Preformatted multiline commit block'
      trigger:
        required: false
        type: string
        description: 'Raw workflow_run event name (ci_status); mapped to a label here'
      commit:
        required: false
        type: string
        description: 'Commit line for deploy / terraform events'
      stacks:
        required: false
        type: string
        description: 'Affected stacks (terraform_started)'
      link:
        required: false
        type: string
        description: 'Primary URL; label (Pull request / Workflow / Run) chosen from event_type'

jobs:
  notify:
    name: Format and send
    runs-on: "${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}"
    steps:
      - name: Build message
        id: format
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EVENT_TYPE: ${{ inputs.event_type }}
          STATUS: ${{ inputs.status }}
          TITLE: ${{ inputs.title }}
          ACTOR: ${{ inputs.actor }}
          REVIEWER: ${{ inputs.reviewer }}
          BRANCH_HEAD: ${{ inputs.branch_head }}
          BRANCH_BASE: ${{ inputs.branch_base }}
          FILE: ${{ inputs.file }}
          BODY: ${{ inputs.body }}
          COMMITS: ${{ inputs.commits }}
          TRIGGER: ${{ inputs.trigger }}
          COMMIT: ${{ inputs.commit }}
          STACKS: ${{ inputs.stacks }}
          LINK: ${{ inputs.link }}
        with:
          result-encoding: string
          script: |
            const e = process.env;
            const et = e.EVENT_TYPE || '';
            const status = e.STATUS || '';
            const title = e.TITLE || '';
            const actor = e.ACTOR || '';
            const reviewer = e.REVIEWER || '';
            const branchHead = e.BRANCH_HEAD || '';
            const branchBase = e.BRANCH_BASE || '';
            const file = e.FILE || '';
            const commits = e.COMMITS || '';
            const commit = e.COMMIT || '';
            const stacks = e.STACKS || '';
            const link = e.LINK || '';

            let body = e.BODY || '';
            if (body.length > 300) {
              body = body.substring(0, 300) + '...';
            }

            // Uniform across every trigger, so derive it here rather than
            // making each caller pass (and risk omitting) it.
            const repository = `${e.GITHUB_SERVER_URL}/${e.GITHUB_REPOSITORY}`;

            const triggerMap = {
              workflow_dispatch: 'Manual',
              schedule: 'Automatic (scheduled)',
              push: 'Automatic (push)',
              pull_request: 'Automatic (pull request)',
              release: 'Automatic (release)',
            };
            const triggerLabel = e.TRIGGER
              ? (triggerMap[e.TRIGGER] || `Automatic (${e.TRIGGER})`)
              : '';

            const branch = (branchHead && branchBase)
              ? `${branchHead} → ${branchBase}`
              : (branchHead || branchBase);

            function header() {
              switch (et) {
                case 'pr_review': {
                  const m = {
                    approved: ['✅', 'Approved'],
                    changes_requested: ['🔴', 'Changes Requested'],
                    commented: ['💬', 'Commented'],
                  };
                  const [emoji, label] = m[status] || ['👀', status || 'Review'];
                  return `${emoji} PR Review: ${label}`;
                }
                case 'ci_status': {
                  const m = {
                    success: '✅', failure: '❌', cancelled: '⚠️',
                    timed_out: '⏰', skipped: '⏭️',
                  };
                  const emoji = m[status] || '❓';
                  const label = status
                    ? status.charAt(0).toUpperCase() + status.slice(1)
                    : 'Unknown';
                  return `${emoji} CI: ${title} - ${label}`;
                }
                case 'terraform_result':
                  return status === 'success'
                    ? '✅ Terraform Apply Succeeded'
                    : '❌ Terraform Apply Failed';
                case 'drift':
                  return status === 'clean'
                    ? '✅ Weekly Drift Check - Clean'
                    : '⚠️ Weekly Drift Check - Drift Detected';
                default: {
                  const fixed = {
                    pr_opened: '🚀 New Pull Request Opened',
                    pr_updated: '🔄 Pull Request Updated',
                    pr_merged: '✅ Pull Request Merged',
                    pr_closed: '❌ Pull Request Closed',
                    pr_review_requested: '👋 Review Requested',
                    pr_commented: '💬 New Comment on PR',
                    pr_review_comment: '🔍 New Review Comment',
                    deploy_started: '🚀 Deployment Started',
                    deploy_success: '✅ Deployment Succeeded',
                    deploy_failure: '❌ Deployment Failed',
                    terraform_started: '🚀 Terraform Apply Started',
                  };
                  return fixed[et] || 'ℹ️ Notification';
                }
              }
            }

            const F = {
              title: title && `📝 Title: ${title}`,
              author: actor && `👤 Author: ${actor}`,
              requester: actor && `👤 Requester: ${actor}`,
              review_by: actor && `👤 Reviewer: ${actor}`,
              actor: actor && `👤 Actor: ${actor}`,
              reviewer: reviewer && `🔎 Reviewer: ${reviewer}`,
              branch: branch && `🌿 Branch: ${branch}`,
              ref: branchHead && `🌿 Branch: ${branchHead}`,
              file: file && `📄 File: ${file}`,
              body: body && `💭 Comment: ${body}`,
              commit: commit && `📝 Commit: ${commit}`,
              stacks: stacks && `🧱 Stacks: ${stacks}`,
              trigger: triggerLabel && `⏰ Trigger: ${triggerLabel}`,
              repository: `📦 Repository: ${repository}`,
              link_pr: link && `🔗 Pull request: ${link}`,
              link_wf: link && `🔗 Workflow: ${link}`,
              link_run: link && `🔗 Run: ${link}`,
              commits: commits && `📋 Commits:\n${commits}`,
            };

            const layout = {
              pr_opened: ['title', 'author', 'branch', 'repository', 'link_pr', 'commits'],
              pr_updated: ['title', 'author', 'branch', 'repository', 'link_pr', 'commits'],
              pr_merged: ['title', 'author', 'branch', 'repository', 'link_pr'],
              pr_closed: ['title', 'author', 'branch', 'repository', 'link_pr'],
              pr_review_requested: ['title', 'requester', 'reviewer', 'repository', 'link_pr'],
              pr_commented: ['title', 'author', 'body', 'repository', 'link_pr'],
              pr_review_comment: ['title', 'author', 'file', 'body', 'repository', 'link_pr'],
              pr_review: ['title', 'review_by', 'repository', 'link_pr'],
              ci_status: ['repository', 'ref', 'trigger', 'actor', 'link_wf'],
              deploy_started: ['repository', 'ref', 'actor', 'commit', 'link_run'],
              deploy_success: ['repository', 'ref', 'actor', 'commit', 'link_run'],
              deploy_failure: ['repository', 'ref', 'actor', 'commit', 'link_run'],
              terraform_started: ['repository', 'ref', 'stacks', 'actor', 'commit', 'link_wf'],
              terraform_result: ['repository', 'ref', 'actor', 'commit', 'link_wf'],
              drift: ['repository', 'link_wf'],
            };

            const lines = (layout[et] || ['repository']).map(k => F[k]).filter(Boolean);
            return `${header()}\n\n${lines.join('\n')}`;

      - name: Send Telegram notification
        env:
          MESSAGE_TEXT: ${{ steps.format.outputs.result }}
          CHAT_ID: ${{ inputs.chat_id }}
          API_URL: ${{ inputs.api_url }}
        run: |
          payload=$(jq -n --arg text "$MESSAGE_TEXT" --arg chat_id "$CHAT_ID" '{chat_id: $chat_id, message: {text: $text}}')

          echo "Sending notification to Telegram..."
          response=$(curl -s -w "\n%{http_code}" -X POST "$API_URL" \
            -H "Content-Type: application/json" \
            -d "$payload")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Response status: $http_code"
          echo "Response body: $body"

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "✅ Notification sent successfully!"
            exit 0
          else
            echo "❌ Failed to send notification (HTTP $http_code)"
            exit 1
          fi
