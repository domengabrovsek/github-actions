# ==============================================
# PR Opened Notification
# ==============================================
# Reusable workflow for PR opened notifications

name: PR Opened Notification

on:
  workflow_call:
    inputs:
      api_url:
        required: true
        type: string
        description: 'Telegram API webhook URL'
      chat_id:
        required: true
        type: string
        description: 'Telegram chat ID to send notifications to'

jobs:
  # The commit list is fetched inside telegram-notify so this stays a single job.
  # A separate fetch job billed a second full minute for roughly five seconds of work.
  notify:
    uses: domengabrovsek/github-actions/.github/workflows/telegram-notify.yml@main
    with:
      api_url: ${{ inputs.api_url }}
      chat_id: ${{ inputs.chat_id }}
      event_type: pr_opened
      title: ${{ github.event.pull_request.title }}
      actor: ${{ github.event.pull_request.user.login }}
      branch_head: ${{ github.event.pull_request.head.ref }}
      branch_base: ${{ github.event.pull_request.base.ref }}
      link: ${{ github.event.pull_request.html_url }}
