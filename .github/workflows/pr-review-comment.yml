# ==============================================
# PR Review Comment Notification
# ==============================================
# Reusable workflow for inline code review comment notifications

name: PR Review Comment Notification

on:
  workflow_call:
    inputs:
      api_url:
        required: true
        type: string
        description: 'Telegram API webhook URL'
      chat_id:
        required: true
        type: string
        description: 'Telegram chat ID to send notifications to'

jobs:
  notify:
    uses: domengabrovsek/github-actions/.github/workflows/telegram-notify.yml@main
    with:
      api_url: ${{ inputs.api_url }}
      chat_id: ${{ inputs.chat_id }}
      event_type: pr_review_comment
      title: ${{ github.event.pull_request.title }}
      actor: ${{ github.event.comment.user.login }}
      file: ${{ github.event.comment.path }}
      body: ${{ github.event.comment.body }}
      link: ${{ github.event.comment.html_url }}
