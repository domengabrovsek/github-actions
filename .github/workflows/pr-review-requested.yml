# ==============================================
# PR Review Requested Notification
# ==============================================
# Reusable workflow for review requested notifications

name: PR Review Requested Notification

on:
  workflow_call:
    inputs:
      api_url:
        required: true
        type: string
        description: 'Telegram API webhook URL'
      chat_id:
        required: true
        type: string
        description: 'Telegram chat ID to send notifications to'

jobs:
  notify:
    uses: domengabrovsek/github-actions/.github/workflows/telegram-notify.yml@main
    with:
      api_url: ${{ inputs.api_url }}
      chat_id: ${{ inputs.chat_id }}
      event_type: pr_review_requested
      title: ${{ github.event.pull_request.title }}
      actor: ${{ github.event.pull_request.user.login }}
      reviewer: ${{ github.event.requested_reviewer.login }}
      link: ${{ github.event.pull_request.html_url }}
