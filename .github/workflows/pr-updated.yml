# ==============================================
# PR Updated Notification
# ==============================================
# Reusable workflow for PR updated notifications

name: PR Updated Notification

on:
  workflow_call:
    inputs:
      api_url:
        required: true
        type: string
        description: 'Telegram API webhook URL'
      chat_id:
        required: true
        type: string
        description: 'Telegram chat ID to send notifications to'

jobs:
  get-commits:
    runs-on: "${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}"
    outputs:
      commits: ${{ steps.format-commits.outputs.result }}
    steps:
      - name: Get new commits from this push
        id: format-commits
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          result-encoding: string
          script: |
            // Get the before and after SHAs from the push event
            const before = context.payload.before;
            const after = context.payload.after || context.payload.pull_request.head.sha;

            console.log(`Comparing commits: ${before}...${after}`);

            // Compare commits to get only the new ones from this push
            const { data: comparison } = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: before,
              head: after
            });

            const newCommits = comparison.commits;

            if (newCommits.length === 0) {
              return '  No new commits';
            }

            return newCommits.map(commit => {
              const message = commit.commit.message.split('\n')[0];
              const sha = commit.sha.substring(0, 7);
              return `  ${sha} - ${message}`;
            }).join('\n');

  notify:
    needs: get-commits
    uses: domengabrovsek/github-actions/.github/workflows/telegram-notify.yml@main
    with:
      api_url: ${{ inputs.api_url }}
      chat_id: ${{ inputs.chat_id }}
      event_type: pr_updated
      title: ${{ github.event.pull_request.title }}
      actor: ${{ github.event.pull_request.user.login }}
      branch_head: ${{ github.event.pull_request.head.ref }}
      branch_base: ${{ github.event.pull_request.base.ref }}
      link: ${{ github.event.pull_request.html_url }}
      commits: ${{ needs.get-commits.outputs.commits }}
