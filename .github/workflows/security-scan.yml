# ==============================================
# Security Scan
# ==============================================
# Reusable workflow bundling the two scans that are copy-pasted across repos:
#   - Gitleaks: secret detection over full history
#   - Bearer:   SAST, failing on high-severity findings and reporting the rest
#
# Usage (consumer):
#
# name: Security
# on:
#   pull_request:
#     branches: [main]
#   push:
#     branches: [main]
# permissions:
#   contents: read
#   pull-requests: read   # required: gitleaks-action lists PR commits on pull_request events
# jobs:
#   security:
#     uses: domengabrovsek/github-actions/.github/workflows/security-scan.yml@main
#
# The caller MUST grant pull-requests: read at the workflow level. A reusable
# workflow's token cannot exceed the caller's grant, so a caller that sets only
# `contents: read` makes gitleaks-action 403 when listing PR commits and the
# secret scan fails without ever scanning.

name: Security Scan

on:
  workflow_call:
    inputs:
      fail_severity:
        required: false
        type: string
        default: 'critical,high'
        description: 'Bearer severities that fail the build'
      warn_severity:
        required: false
        type: string
        default: 'medium,low,warning'
        description: 'Bearer severities reported without failing the build'
      iac_scan:
        required: false
        type: boolean
        default: false
        description: 'Run the Trivy IaC config scan and publish its SARIF to code scanning'
      iac_path:
        required: false
        type: string
        default: 'terraform'
        description: 'Directory scanned when iac_scan is enabled'

jobs:
  # gitleaks and bearer share one job because each bills a full minute even though
  # both finish in seconds, and they need the same checkout. Combined they still
  # come in under the one-minute floor, so the pair costs what one used to.
  # A gitleaks finding fails the job before bearer runs, which is the same outcome
  # as the previous split: a secret in the diff blocked the PR either way.
  scan:
    name: Scan (gitleaks, bearer)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action lists PR commits on pull_request events; without this it 403s.
      pull-requests: read
    steps:
      - uses: domengabrovsek/github-actions/.github/actions/checkout@main
        with:
          # Full history so gitleaks scans every commit, not just the tip.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Bearer (fail on high severity)
        uses: bearer/bearer-action@828eeb928ce2f4a7ca5ed57fb8b59508cb8c79bc # v2
        with:
          severity: ${{ inputs.fail_severity }}
      - name: Bearer (report low severity)
        uses: bearer/bearer-action@828eeb928ce2f4a7ca5ed57fb8b59508cb8c79bc # v2
        with:
          severity: ${{ inputs.warn_severity }}
          exit-code: 0

  # Opt-in: Terraform/OpenTofu misconfiguration scan. Off by default because most
  # consumers ship no IaC. Trivy runs with continue-on-error so a scanner fault
  # cannot block a PR; the SARIF upload is what surfaces findings, and it is
  # skipped when Trivy produced no file.
  iac-scan:
    name: IaC Scan (trivy)
    if: inputs.iac_scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Publishing SARIF needs this; the caller must grant it at workflow level too.
      security-events: write
    steps:
      - uses: domengabrovsek/github-actions/.github/actions/checkout@main
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ inputs.iac_path }}
          format: sarif
          output: trivy-results.sarif
        continue-on-error: true
      - if: hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-results.sarif
