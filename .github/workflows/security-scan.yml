# ==============================================
# Security Scan
# ==============================================
# Reusable workflow bundling the two scans that are copy-pasted across repos:
#   - Gitleaks: secret detection over full history
#   - Bearer:   SAST, failing on high-severity findings and reporting the rest
#
# Usage (consumer):
#
# name: Security
# on:
#   pull_request:
#     branches: [main]
#   push:
#     branches: [main]
# permissions:
#   contents: read
#   pull-requests: read   # required: gitleaks-action lists PR commits on pull_request events
# jobs:
#   security:
#     uses: domengabrovsek/github-actions/.github/workflows/security-scan.yml@main
#
# The caller MUST grant pull-requests: read at the workflow level. A reusable
# workflow's token cannot exceed the caller's grant, so a caller that sets only
# `contents: read` makes gitleaks-action 403 when listing PR commits and the
# secret scan fails without ever scanning.

name: Security Scan

on:
  workflow_call:
    inputs:
      fail_severity:
        required: false
        type: string
        default: 'critical,high'
        description: 'Bearer severities that fail the build'
      warn_severity:
        required: false
        type: string
        default: 'medium,low,warning'
        description: 'Bearer severities reported without failing the build'

jobs:
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action lists PR commits on pull_request events; without this it 403s.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so gitleaks scans every commit, not just the tip.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

  security-scan:
    name: Security Scan (bearer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bearer (fail on high severity)
        uses: bearer/bearer-action@828eeb928ce2f4a7ca5ed57fb8b59508cb8c79bc # v2
        with:
          severity: ${{ inputs.fail_severity }}
      - name: Bearer (report low severity)
        uses: bearer/bearer-action@828eeb928ce2f4a7ca5ed57fb8b59508cb8c79bc # v2
        with:
          severity: ${{ inputs.warn_severity }}
          exit-code: 0
