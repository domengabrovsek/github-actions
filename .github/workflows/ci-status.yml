# ==============================================
# CI Status Notification
# ==============================================
# Reusable workflow for CI/CD workflow run status notifications
# Note: workflow_run triggers are repo-specific, so consumers
# must define their own trigger workflow (see README for example)

name: CI Status Notification

on:
  workflow_call:
    inputs:
      api_url:
        required: true
        type: string
        description: 'Telegram API webhook URL'
      chat_id:
        required: true
        type: string
        description: 'Telegram chat ID to send notifications to'

jobs:
  notify:
    uses: domengabrovsek/github-actions/.github/workflows/telegram-notify.yml@main
    with:
      api_url: ${{ inputs.api_url }}
      chat_id: ${{ inputs.chat_id }}
      event_type: ci_status
      status: ${{ github.event.workflow_run.conclusion }}
      title: ${{ github.event.workflow_run.name }}
      branch_head: ${{ github.event.workflow_run.head_branch }}
      trigger: ${{ github.event.workflow_run.event }}
      actor: ${{ github.event.workflow_run.actor.login }}
      link: ${{ github.event.workflow_run.html_url }}
