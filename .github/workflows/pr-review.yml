# ==============================================
# PR Review Notification
# ==============================================
# Reusable workflow for PR review submitted notifications

name: PR Review Notification

on:
  workflow_call:
    inputs:
      api_url:
        required: true
        type: string
        description: 'Telegram API webhook URL'
      chat_id:
        required: true
        type: string
        description: 'Telegram chat ID to send notifications to'
      runs-on:
        required: false
        type: string
        default: '"ubuntu-latest"'
        description: 'Runner labels as JSON, e.g. ["self-hosted","air"]; pass vars.CI_RUNNER'

jobs:
  notify:
    uses: domengabrovsek/github-actions/.github/workflows/telegram-notify.yml@main
    with:
      runs-on: ${{ inputs.runs-on }}
      api_url: ${{ inputs.api_url }}
      chat_id: ${{ inputs.chat_id }}
      event_type: pr_review
      status: ${{ github.event.review.state }}
      title: ${{ github.event.pull_request.title }}
      actor: ${{ github.event.review.user.login }}
      link: ${{ github.event.pull_request.html_url }}
