# ==============================================
# PR Review Notification
# ==============================================
# Reusable workflow for PR review submitted notifications

name: PR Review Notification

on:
  workflow_call:
    inputs:
      api_url:
        required: true
        type: string
        description: 'Telegram API webhook URL'
      chat_id:
        required: true
        type: string
        description: 'Telegram chat ID to send notifications to'

jobs:
  format-review:
    runs-on: ubuntu-latest
    outputs:
      message: ${{ steps.build-message.outputs.result }}
    steps:
      - name: Build review message
        id: build-message
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          result-encoding: string
          script: |
            const review = context.payload.review;
            const pr = context.payload.pull_request;

            const stateMap = {
              approved: { emoji: '✅', label: 'Approved' },
              changes_requested: { emoji: '🔴', label: 'Changes Requested' },
              commented: { emoji: '💬', label: 'Commented' }
            };

            const { emoji, label } = stateMap[review.state] || { emoji: '👀', label: review.state };

            let message = `${emoji} PR Review: ${label}\n\n`;
            message += `📝 Title: ${pr.title}\n`;
            message += `👤 Reviewer: ${review.user.login}\n`;
            message += `📦 Repository: ${context.payload.repository.html_url}\n`;
            message += `🔗 Pull request: ${pr.html_url}`;

            return message;

  notify:
    needs: format-review
    uses: domengabrovsek/github-actions/.github/workflows/send-telegram-message.yml@main
    with:
      api_url: ${{ inputs.api_url }}
      chat_id: ${{ inputs.chat_id }}
      message: ${{ needs.format-review.outputs.message }}
